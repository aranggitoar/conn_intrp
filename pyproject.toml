[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conn-intrp"
version = "0.1.0"
description = "Mechanistic interpretability of cross-modal connectors in VLMs"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "transformers>=4.40.0",
    "tqdm",
    "numpy",
    "rapidfuzz",
    "Pillow",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
